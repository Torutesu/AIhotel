name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (required for type-check)
        run: pnpm --filter backend db:generate

      - name: Type-check all packages
        run: pnpm --filter './*' type-check

      - name: Lint backend (architecture boundary rules)
        run: pnpm --filter backend lint

      - name: Lint frontend
        run: pnpm --filter frontend lint

      - name: Unit tests (frontend)
        run: pnpm --filter frontend test

      - name: Unit tests (backend)
        run: pnpm --filter backend test

      - name: Build backend
        run: pnpm --filter backend build

      - name: Build frontend (demo mode must be off in the default build)
        run: pnpm --filter frontend build
        env:
          NEXT_PUBLIC_DEMO_MODE: ''

      - name: Verify demo mode is disabled in the build output
        run: node scripts/verify-demo-mode.mjs --expect-disabled
        working-directory: frontend

  database:
    name: Migrations, schema drift, seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel_revenue_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/hotel_revenue_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:password@localhost:5432/hotel_revenue_shadow?schema=public
      JWT_SECRET: ci-only-jwt-secret-value-not-used-in-production-0000
      # 統合テストが DATABASE_URL の設定漏れで黙ってスキップされないようにする（#87）
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate schema
        run: npx prisma validate
        working-directory: backend

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Fail if schema.prisma has drifted from committed migrations
        run: |
          psql "postgresql://postgres:password@localhost:5432/postgres" -c 'CREATE DATABASE hotel_revenue_shadow;'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
        working-directory: backend

      - name: Generate Prisma client
        run: pnpm --filter backend db:generate

      - name: Seed twice (idempotency)
        run: |
          pnpm --filter backend db:seed
          pnpm --filter backend db:seed

      - name: Backend tests against PostgreSQL (unit + integration)
        run: pnpm --filter backend test

  e2e:
    # ブラウザを通したスモークテスト（#87）: 3ロールのログイン・主要タブの描画・
    # ロール別の表示・PDF ダウンロード・ログアウト
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: hotel_revenue_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/hotel_revenue_e2e?schema=public
      JWT_SECRET: ci-only-jwt-secret-value-not-used-in-production-0000
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:3001
      TRUST_PROXY: '1'
      NEXT_PUBLIC_DEMO_MODE: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        run: |
          npx prisma migrate deploy
          pnpm db:seed
        working-directory: backend

      - name: Build backend and frontend
        run: |
          pnpm --filter backend build
          pnpm --filter frontend build

      - name: Start servers
        run: |
          (cd backend && PORT=3001 nohup node dist/index.js > ../backend.log 2>&1 &)
          (cd frontend && PORT=3000 nohup npx next start > ../frontend.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3001/health > /dev/null && curl -fs http://localhost:3000/ > /dev/null; then
              echo "servers are up"; exit 0
            fi
            sleep 2
          done
          echo "servers did not start"; cat backend.log frontend.log; exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E smoke tests
        run: pnpm --filter @hotel-revenue-system/e2e test

      - name: Upload traces and server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/test-results
            backend.log
            frontend.log
          retention-days: 7

  audit:
    name: Dependency audit (high / critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level=high

  docker:
    name: Docker images build and smoke test
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: hotel_revenue_docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          load: true
          tags: hotel-revenue-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # ビルドできても起動しないイメージ（pnpm のシンボリックリンク構造の破損など）を検出する（#86）
      - name: Smoke test backend image (migrate → serve → daily job)
        env:
          IMAGE: hotel-revenue-backend:ci
          DATABASE_URL: postgresql://postgres:password@localhost:5432/hotel_revenue_docker?schema=public
          JWT_SECRET: ci-only-jwt-secret-value-not-used-in-production-0000
        run: |
          COMMON="--network host -e NODE_ENV=production -e DATABASE_URL=$DATABASE_URL -e JWT_SECRET=$JWT_SECRET -e FRONTEND_URL=http://localhost:3000"
          docker run --rm $COMMON "$IMAGE" migrate
          docker run -d --name backend $COMMON -e PORT=3001 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3001/readyz > /dev/null; then break; fi
            sleep 2
          done
          curl -fs http://localhost:3001/livez
          curl -fs http://localhost:3001/readyz
          docker run --rm $COMMON "$IMAGE" job daily
      - name: Backend container logs
        if: always()
        run: docker logs backend || true
