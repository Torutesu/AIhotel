name: Release images

# タグ（v1.2.3 など）を push すると、backend / frontend のイメージを GHCR に push する（#86）。
# デプロイ先（ECS / Cloud Run / Kubernetes など）はこのイメージを使う。クラウド固有の操作はここに書かない。
# 手順は docs/運用手順書.md の「リリース」を参照。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hotel-revenue-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
